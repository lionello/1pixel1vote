name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test
        run: node --test test/aggregation.test.cjs
      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          case "$status" in
            200) echo 'enabled=true' >> "$GITHUB_OUTPUT" ;;
            404) echo 'enabled=false' >> "$GITHUB_OUTPUT"; echo 'GitHub Pages is not enabled yet.' >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "GitHub Pages check failed with HTTP $status"; exit 1 ;;
          esac
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: dist
      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
